name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node --check server.js
          node --check deputy.js
      - name: OpenCode scan regression (scratch db, no live sessions needed)
        run: node test/opencode_scan.mjs
